<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <h1>Enigma machine</h1>

            <div class="btn-group" role="group" aria-label="Operation mode">
                <a href="/key/" class="btn btn-outline-danger {% if current_path == '/key/' or current_path == '/' %}active{% endif %}">Set Key</a>
                <a href="/encrypt/" class="btn btn-outline-warning {% if current_path == '/encrypt/' %}active{% endif %}">Encrypt</a>
                <a href="/decrypt/" class="btn btn-outline-success {% if current_path == '/decrypt/' %}active{% endif %}">Decrypt</a>
                <a href="/plugs/" class="btn btn-outline-info {% if current_path == '/plugs/' %}active{% endif %}">Plugs</a>
                <a href="#" class="btn btn-outline">Current Key: {{ key }}</a>
            </div>

            <div class="mt-3">
                <form method="post">
                    {% csrf_token %}
                    <div class="input-group input-group-lg">
                        <input class="form-control" type="text" name="message" placeholder="{{ placeholder }}" aria-label="User message input" required>
                        <button class="btn btn-primary" type="submit">Submit</button>
                    </div>
                    {% if message %}
                        {% if current_path == '/encrypt/' or current_path == '/decrypt/' or current_path == '/plugs/' %}
                        <div class="alert alert-info" role="alert">
                          {{ message }}
                        </div>
                        {% endif %}
                    {% endif %}
                </form>
            </div>
        </div>
    </body>
</html>
